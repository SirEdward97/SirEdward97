<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" width="880" height="128" role="img" aria-label="Portafolio de Servicios 3D Interactivo — Haz clic para ingresar a portafolio97.vercel.app">
  <style>
    .pulse {
      animation: pulse 1.8s ease-in-out infinite;
      transform-origin: 34px 31px;
    }
    .ring {
      animation: ring 1.8s ease-out infinite;
      transform-origin: 34px 31px;
    }
    .btn-glow {
      animation: btnGlow 2.4s ease-in-out infinite;
    }
    .arr {
      animation: arrMove 1.1s ease-in-out infinite;
    }
    .tw1 { animation: twinkle 2.6s ease-in-out infinite; }
    .tw2 { animation: twinkle 3.2s ease-in-out 0.9s infinite; }
    .tw3 { animation: twinkle 2.2s ease-in-out 1.5s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    @keyframes ring {
      0% { transform: scale(1); opacity: 0.75; }
      100% { transform: scale(2.6); opacity: 0; }
    }
    @keyframes btnGlow {
      0%, 100% { fill-opacity: 0.16; }
      50% { fill-opacity: 0.34; }
    }
    @keyframes arrMove {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(5px); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.85; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f14" />
      <stop offset="55%" stop-color="#090b10" />
      <stop offset="100%" stop-color="#061816" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5c4" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#00f5c4" stop-opacity="0.95" />
    </linearGradient>
    <radialGradient id="cyanAura" cx="82%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#00f5c4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00f5c4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="btnFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffd0" />
      <stop offset="100%" stop-color="#00cfa6" />
    </linearGradient>
  </defs>

  <!-- Outer background & border -->
  <rect width="880" height="128" rx="8" fill="#030305" />
  <rect x="4" y="4" width="872" height="120" rx="6" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect x="4" y="4" width="872" height="120" rx="6" fill="url(#cyanAura)" />

  <!-- Subtle 3D galaxy star particles -->
  <g fill="#ffffff">
    <circle class="tw1" cx="520" cy="24" r="1.2" />
    <circle class="tw2" cx="592" cy="42" r="1.5" fill="#00f5c4" />
    <circle class="tw3" cx="556" cy="98" r="1.1" />
    <circle class="tw1" cx="624" cy="18" r="1.3" />
    <circle class="tw2" cx="485" cy="106" r="1.2" fill="#00f5c4" />
    <circle class="tw3" cx="612" cy="108" r="1.0" />
  </g>

  <!-- Left accent bar -->
  <rect x="4" y="22" width="3.5" height="84" rx="1.75" fill="#00f5c4" />

  <!-- Live status pill -->
  <circle class="ring" cx="34" cy="31" r="4.5" fill="none" stroke="#00f5c4" stroke-width="1.4" />
  <circle class="pulse" cx="34" cy="31" r="4.2" fill="#00f5c4" />
  <text x="46" y="35" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:1.1px;fill:#00f5c4">
    PORTAFOLIO DE SERVICIOS · EXPERIENCIA 3D EN VIVO
  </text>

  <!-- Main compelling headline -->
  <text x="28" y="67" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:19.5px;font-weight:700;fill:#ffffff">
    ¿Quieres ver mis proyectos cobrar vida en 3D?
  </text>

  <!-- Persuasive subheadline -->
  <text x="28" y="93" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.8px;font-weight:400;fill:#c9d1d9">
    Explora mi galaxia de <tspan fill="#00f5c4" font-weight="600">160,000 estrellas</tspan>, el túnel de viento <tspan fill="#ffffff" font-weight="600">F1 RB22</tspan> y mis servicios web.
  </text>

  <!-- Right CTA Button -->
  <rect class="btn-glow" x="634" y="26" width="218" height="58" rx="9" fill="#00f5c4" />
  <rect x="640" y="32" width="206" height="46" rx="7" fill="url(#btnFill)" />
  <text x="726" y="60" text-anchor="middle" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:800;letter-spacing:0.6px;fill:#04120f">
    VISITAR PORTAFOLIO
  </text>
  <g class="arr">
    <path d="M810 55.5h13M818 50.5l5 5-5 5" stroke="#04120f" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- URL caption below button -->
  <text x="743" y="100" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:500;fill:#00f5c4">
    portafolio97.vercel.app ↗
  </text>
</svg>
